version: '3.9'

services:
  iotmonitoring-app:
    container_name: iotmonitoring-app

    build:
      context: .
      dockerfile: IotMonitering.App/Dockerfile

    image: iotmonitoring-app:latest

    ports:
      - "5000:5000"
      - "5001:5001"
      - "5002:5002"
      - "6000:6000"
      - "6001:6001"

    environment:
      ASPNETCORE_ENVIRONMENT: Development

    restart: unless-stopped